<section class="work-container">
  <section class="bg-sky"></section>
  <section class="work-info">
    <swiper-container class="mySwiper" pagination="true" pagination-clickable="true" navigation="false"
      space-between="30" centered-slides="true" autoplay-delay="2000" effect="fade" cssMode="true"
      autoplay-disable-on-interaction="true">
      <swiper-slide lazy="true">
        <img loading="lazy" [src]="'assets/projects/tarjeta/tarjeta.jpg'" alt="Tarjeta Navideña" />
      </swiper-slide>
      <swiper-slide>
        <img loading="lazy" [src]="'assets/projects/tarjeta/tarjeta2.jpg'" alt="Tarjeta Navideña" />
      </swiper-slide>
      <swiper-slide>
        <img loading="lazy" [src]="'assets/projects/tarjeta/tarjeta3.jpg'" alt="Tarjeta Navideña" />
      </swiper-slide>
    </swiper-container>

    <aside class="work-description">
      <section class="description-info">
        <h2>Información</h2>
        <p>
          Tarjeta navideña para celebrar la víspera de la Navidad.
        </p>
      </section>
      <section class="description-client">
        <h2>Cliente</h2>
        <p>Nelica</p>
      </section>
      <section class="description-social">
        <a class="link-website bg-tarjeta" href="http://gruponelica.com/navidad2018/" target="_blank"
          rel="noopener noreferrer">
          Website
        </a>
        <ul>
          <li>
            <span class="material-symbols-outlined">
              calendar_month
            </span>
            20/12/2018
          </li>
          <li>
            <span class="material-symbols-outlined">
              directions_car
            </span>
            Transporte
          </li>
        </ul>
      </section>
    </aside>
  </section>

  <section class="work-navigation bg-tarjeta">
    <a href="works/amigovip">
      <span class="material-symbols-outlined">
        arrow_back
      </span>
      Amigo Vip
    </a>

    <a href="works/triptico">
      Tríptico
      <span class="material-symbols-outlined">
        arrow_forward
      </span>
    </a>
  </section>
</section>

<section class="visit">
  <h1 class="primary-color">¡Gracias por tu visita!</h1>
  <h2>Carlos' Portfolio © {{ infoService.getYear() }}</h2>
</section>
