<section id="projects">
  <div class="portfolio workspace">
    <div class="top-section">
      <div class="projects-title">
        <h1><span>{{ language.t('projects.titleLead') }}&nbsp;</span><span class="primary-color">{{ language.t('projects.titleHighlight') }}&nbsp;</span>{{ language.t('projects.titleSuffix') }}</h1>
      </div>
    </div>

    <ng-template #projectTemplate let-project>

      <article class="card-project h-full flex flex-col
      rounded-xl p-1 bg-linear-to-r from-indigo-400 to-emerald-600 shadow-lg">

        <div class="project-image flex flex-1 items-center justify-center rounded-t-2xl rounded-l-2xl rounded-b-none bg-white">
          <img class="pointer-events-none w-fit p-2" [src]="project.image" [alt]="project.name" />
        </div>

        <div class="project-options">
          <h5 class="text-lg" [title]="project.name">{{project.name}}</h5>
          <div class="project-actions">
            <a class="project-action project-action--primary"
              [attr.aria-label]="language.t('projects.viewDetails')"
              [routerLink]="['/works', project.path]">
              <span>{{ language.t('projects.viewDetails') }}</span>
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14" />
                <path d="m12 5 7 7-7 7" />
              </svg>
            </a>
          @if(project.link){
          <a class="project-action project-action--secondary" [attr.aria-label]="language.t('projects.viewSite')"
            [attr.title]="language.t('projects.viewSite')" [href]="project.link" target="_blank" rel="noreferrer noopener">
            <span>{{ language.t('projects.viewSite') }}</span>
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 3h7v7" />
              <path d="m10 14 11-11" />
              <path d="M21 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h6" />
            </svg>
          </a>
          }
          </div>
        </div>

      </article>

    </ng-template>
  </div>

  <div class="mx-3">
    <app-custom-carousel [items]="projects()" [itemTemplate]="projectTemplate" [visibleItems]="4"
      [loop]="true" [navigation]="true" [autoplay]="false" />
  </div>
</section>
