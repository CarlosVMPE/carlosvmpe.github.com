<section class="education-section">
  <h2 class="section-title">Educación</h2>

  <div class="timeline-container">
    @for (item of educationList; track item.title) {
    <div class="timeline-item {{ item.alignClass }} {{ item.colorClass }}">

      <div class="card">
        <div class="education-header">
          <h3>{{ item.title }}</h3>
        </div>

        <!-- Bloque de sub-estudios -->
        <div class="sub-items-container">
          @for (sub of item.subItems; track sub.institution; let last = $last) {
          <div class="sub-item" [class.with-divider]="!last">
            <h4 class="institution">{{ sub.institution }}</h4>
            <span class="period">{{ sub.period }}</span>
          </div>
          }
        </div>
      </div>

    </div>
    }
  </div>
</section>
