<!-- Botón flotante para cambiar de idioma -->
<button (click)="language.toggle()"
  class="fixed cursor-pointer bottom-6 right-6 z-50 flex items-center gap-2 bg-[#1e293b]/90 text-white px-4 py-3 rounded-full shadow-2xl border border-slate-700 hover:border-[#00bcd4] hover:bg-[#1e293b] transition-all duration-300 backdrop-blur-md group"
  [attr.aria-label]="language.t('language.toggleLabel')">
  <svg class="w-5 h-5 text-[#00bcd4] group-hover:rotate-180 transition-transform duration-500" fill="none"
    stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
      d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9">
    </path>
  </svg>
  <span class="text-sm font-semibold tracking-wider uppercase">
    {{ language.current() === 'es' ? 'EN' : 'ES' }}
  </span>
</button>
