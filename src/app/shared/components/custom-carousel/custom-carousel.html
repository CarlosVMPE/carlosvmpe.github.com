<div class="carousel" role="region" aria-roledescription="carousel" aria-label="Carrusel de elementos"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()"

  (focusin)="onFocusIn()"
  (focusout)="onFocusOut($event)">

  <div
    #viewport
    class="carousel__viewport"
    [ngClass]="{'carousel__without-navigations': !navigation()}"

    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp($event)"
    (pointercancel)="onPointerCancel($event)"
  >

    <div
      class="carousel__track"

      [class.carousel__track--dragging]="
        isDragging()
      "

      [class.carousel__track--no-transition]="
        !transitionEnabled()
      "

      [style.transform]="
        'translate3d(' +
        translateX +
        'px, 0, 0)'
      "

      (transitionend)="onTransitionEnd($event)"
    >

      @for (
        item of renderedItems;
        track $index
      ) {

        <div
          class="carousel__slide"
          [ngClass]="{'carousel__slide-no-spacing': !navigation()}"
          [attr.aria-hidden]="isInactiveClone($index) ? 'true' : null"
          [attr.inert]="isInactiveClone($index) ? '' : null"
          [style.width]="slideWidth"
        >

          <ng-container
            [ngTemplateOutlet]="itemTemplate()"
            [ngTemplateOutletContext]="{
              $implicit: item
            }"
          />

        </div>

      }

    </div>

  </div>


  <!-- PREVIOUS -->

  @if(navigation() && totalItems > currentVisibleItems){

    <button
      type="button"
      class="carousel__button carousel__button--prev"
      (click)="previous()"
      aria-label="Anterior"
      title="Anterior"
    >
      <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
        <path d="m15 18-6-6 6-6" />
      </svg>
    </button>

  }


  <!-- NEXT -->

  @if(navigation() && totalItems > currentVisibleItems){

    <button
      type="button"
      class="carousel__button carousel__button--next"
      (click)="next()"
      aria-label="Siguiente"
      title="Siguiente"
    >
      <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
        <path d="m9 18 6-6-6-6" />
      </svg>
    </button>

  }


  <!-- PAGINATION -->

  @if(showPagination()){
    @if (totalItems > currentVisibleItems) {

    <div class="carousel__pagination">

      @for (
        item of items();
        track $index
      ) {

        <button
          type="button"
          class="carousel__dot"

          [class.carousel__dot--active]="
            realIndex === $index
          "

          (click)="goTo($index)"

          [attr.aria-label]="
            'Ir al slide ' +
            ($index + 1)
          "
        >
        </button>

      }

    </div>

  }
  }

</div>
