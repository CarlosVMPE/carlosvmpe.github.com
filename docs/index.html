<body>
  <app-root></app-root>

  <script>
    setTimeout(() => {
      const menu = document.querySelector('.menu-icon');
      const options = document.querySelector('.nav-options');
      const body = document.querySelector('body');
      if(menu){
        menu.addEventListener('click', () => {
        if (options.classList.contains('show-nav')) {
          body.style.overflowY = 'scroll'
          options.classList.remove('show-nav')
        } else {

          body.style.overflowY = 'hidden'
          options.classList.add('show-nav')
        }
      })
      }

      const anchr = document.querySelectorAll('.nav-options a');
      anchr.forEach(a => {
        a.addEventListener('click', () => {
          if (options.classList.contains('show-nav')) {
            options.classList.remove('show-nav')
            body.style.overflowY = 'scroll'
          } else {
            body.style.overflowY = 'scroll'
            options.classList.add('show-nav')
          }
        })
      })
    }, 800);
  </script>
